name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Only `matrix.os` and `github.ref` are interpolated, and never inside a `run:` — no
# event-controlled text reaches a shell here.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unit:
    name: unit (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      # the .cmd shim is generated with CRLF on purpose; don't let git rewrite fixtures
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun test src

  # chvm is published to npm and must run under plain Node — that is what makes
  # `npm i -g @crewhaus/chvm` a one-line install. Bun builds it; Node runs it.
  node:
    name: node ${{ matrix.node }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [18, 22]
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: bun install --frozen-lockfile
      - run: bun run build
      # the packaged CLI, installed and run exactly as a user would
      - run: npm pack
        shell: bash
      - run: npm install -g ./crewhaus-chvm-*.tgz
        shell: bash
      - run: chvm --version
        shell: bash
      - run: chvm ls-remote
        shell: bash

  e2e:
    name: e2e (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: unit
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      # installs a real crewhaus release from npm and drives the generated shim
      - run: bun test test
